name: mather_sathi
description: AI crop disease diagnosis for Bangladeshi farmers (Krishi Sahay).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  # Firebase (Phase 0, task 0.4). Versions follow the design doc; run
  # `flutter pub upgrade --major-versions` and commit pubspec.lock.
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_app_check: ^0.4.8
  sqflite: ^2.4.4+1
  path: ^1.9.1
  path_provider: ^2.1.6
  go_router: ^18.0.2
  firebase_remote_config: ^6.7.0
  uuid: ^4.6.0
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  image: ^4.10.1
  shared_preferences: ^2.5.6
  characters: ^1.4.1
  cloud_functions: ^6.5.0
  connectivity_plus: ^7.3.2
  firebase_crashlytics: ^5.4.0
  flutter_tts: ^4.2.5
  cloud_firestore: ^6.10.0
  tflite_flutter: ^0.12.1
  firebase_messaging: ^16.7.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  firebase_storage: ^13.6.0
  screenshot: ^3.0.0
  firebase_analytics: ^12.6.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
  fake_async: ^1.3.3
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
  assets:
    - assets/kb/
    - assets/models/
    - assets/data/
    - assets/images/
