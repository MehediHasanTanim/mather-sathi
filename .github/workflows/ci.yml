name: ci
on: [pull_request, push]
jobs:
  kb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tools/kb_build/test/*.test.js
      # dev may contain drafts; stg and prod must validate with drafts excluded
      - run: node tools/kb_build/build.js --env dev --check
      - run: node tools/kb_build/build.js --env stg --validate
      - run: node tools/kb_build/build.js --env prod --validate
      - run: node tools/sync_functions_data.js --check
      - run: node --test tools/model_check/test/*.test.js
      - run: node tools/model_check/check.js
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --prefix functions
      - run: npm run lint --prefix functions
      - run: npm test --prefix functions
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4   # the Firestore and Storage emulators run on the JVM
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --prefix firebase
      - run: npm run test:emulated --prefix firebase
  e2e:
    runs-on: ubuntu-latest
    needs: [functions, rules]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --prefix functions
      - run: npm run build --prefix functions
      - run: echo "ANTHROPIC_API_KEY=x" > functions/.secret.local
      - run: npm install --prefix firebase
      # Alerts (7.7), data deletion (8.2/8.3) and the kill-switch / KB rollback drills (9.4), on the emulators with the real rules
      - run: npx --yes firebase-tools@latest emulators:exec --only functions,firestore,auth --project demo-krishi "node firebase/test/e2e/alerts_e2e.js"
      - run: npx --yes firebase-tools@latest emulators:exec --only functions,firestore,auth,storage --project demo-krishi "node firebase/test/e2e/delete_e2e.js"
      - run: npx --yes firebase-tools@latest emulators:exec --only functions,firestore,auth,storage --project demo-krishi "node firebase/test/e2e/drills_e2e.js"
