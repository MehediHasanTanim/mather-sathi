name: ci
on: [pull_request, push]
jobs:
  kb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tools/kb_build/test/*.test.js
      # dev may contain drafts; stg and prod must validate with drafts excluded
      - run: node tools/kb_build/build.js --env dev --check
      - run: node tools/kb_build/build.js --env stg --validate
      - run: node tools/kb_build/build.js --env prod --validate
      - run: node tools/sync_functions_data.js --check
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --prefix functions
      - run: npm run lint --prefix functions
      - run: npm test --prefix functions
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test --prefix firebase
